company: teleNetwork
location: Remote
period: Dec 2013 – Mar 2020
order: 4
icon: monitor
summary: >-
  Six years growing from telecom support to white-glove Tier 2 SaaS support
  and Tier 1 training, then technical recruiting.
roles:
  - title: Technical Recruiter
    period: Apr 2018 – Mar 2020
    highlights:
      - Supported full-cycle technical recruiting with the Recruiting Coordinator, from job postings on the company's WordPress site and applicant tracking to outreach, screens, and phone interviews.
      - Ran Google Meet interviews and started onboarding, including new-hire paperwork and background-check review.
  - title: Tier 2 Technical Specialist
    team: White-glove SaaS support
    period: May 2016 – Apr 2018
    highlights:
      - Provided white-glove technical support to customers of a mid-sized SaaS company over live chat and phone.
      - Assisted Tier 1 representatives over chat and led training sessions for Tier 1 agents and group training for customers.
      - Used screen sharing to walk clients through escalated cases, and escalated tickets to engineering, sales, or other teams so issues were addressed quickly.
  - title: Technical Specialist
    team: White-glove SaaS support
    period: Dec 2013 – May 2016
    highlights:
      - Provided SaaS technical support over live chat and phone, consistently meeting white-glove SLA requirements.
      - Helped keep the customer-facing knowledge base current.
  - title: Technical Support Representative
    team: Telecommunications
    period: Dec 2013 – May 2016
    highlights:
      - Provided phone-based technical support to consumers of a national telecommunications provider, determining whether issues were on the line, in the modem or router, or outside the team's scope.
      - Scheduled field-technician appointments and routed customers to billing, retention, or higher-level support when needed.
