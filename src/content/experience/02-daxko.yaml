roles:
  - title: Client Success Advocate (Tier 2)
    team: Non-Profit Division, Finance Team
    period: Sep 2022 – Aug 2025
    highlights:
      - Provided software support for Daxko Operations (Finance and Fundraising) and Daxko Accounting over phone, live chat, email and tickets, and Zoom.
      - Investigated discrepancies between reports (Aged Receivables, Balance Sheet, Income Statement) and financials, including journal entries, data exports, and fundraising records.
      - Identified and reproduced software errors, then wrote detailed escalation reports for Payment Services, software engineers, and other teams, with reproduction steps and screenshots or screen recordings.
      - Troubleshot credit card and EFT payment-processing errors and, when needed, liaised with payment processors to reach a resolution.
      - Worked with database administrators to find erroneous entries through testing and detailed written reports.
      - Helped clients complete annual PCI compliance requirements and scanning.
      - Led Zoom training refreshers and detailed software walkthroughs with clients.
      - Covered a rotating emergency-phone schedule so clients had 24/7 support access.
