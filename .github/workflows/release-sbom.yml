# Generate a production dependency inventory for review and attach it to releases.
name: release-sbom

on:
  pull_request:
    branches: [test, staging, production]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  generate:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: npm install -g corepack && corepack enable pnpm

      - name: Generate production SBOM
        run: pnpm sbom --lockfile-only --prod --sbom-format cyclonedx --sbom-type application --out sbom.cdx.json

      - name: Validate SBOM
        run: node -e "const b = require('./sbom.cdx.json'); if (b.bomFormat !== 'CycloneDX' || !b.components?.length) process.exit(1)"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  attach:
    name: Attach SBOM to release
    if: github.event_name == 'release'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: production-sbom

      - name: Attach SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" sbom.cdx.json
